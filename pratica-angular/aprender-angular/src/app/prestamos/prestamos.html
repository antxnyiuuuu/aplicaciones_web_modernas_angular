<h1>Mi cuenta de git uwu</h1>
<a [href]="url" [class.activo]="redirigir" target="_blank">Ir a mi cuenta de GIt</a>
@if(redirigir){
<p>¡El enlace funciona correctamente!</p>
<button (click)="cambiarRedirigir()">Ocultar Enlace a mi cuenta de GIt</button>
}@else {
<p>Lo sentimos, este enlace no está disponible.</p>
<button (click)="cambiarRedirigir()">Mostrar Enlace a mi cuenta de GIt</button>
}
<ul>
    @for (prestamo of prestamosList; track prestamo.id) {    
  <li
    [class.aprobado]="prestamo.estado == 'Aprobado'"
    [class.pendiente]="prestamo.estado != 'Aprobado'"
  >
    Monto: ${{ prestamo.monto }} | Estado: {{ prestamo.estado }}
  </li>
    }
</ul>
