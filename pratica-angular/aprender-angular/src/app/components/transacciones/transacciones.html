@for (transaccion of transaccionesList; track transaccion.id) {
  <hr />
  <div [ngClass]="transaccion.tipo=='ingreso'? 'ingreso': 'egreso'">
    <p><strong>ID:</strong> {{ transaccion.id }}</p>
    <p><strong>Fecha:</strong> {{ transaccion.fecha}}</p>
    <p><strong>Descripción:</strong> {{ transaccion.descripcion }}</p>
    <p><strong>Monto:</strong> ${{ transaccion.monto }}</p>
    <p><strong>Tipo:</strong> {{ transaccion.tipo }}</p>
  </div>
}
